version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Mirrors minimumReleaseAge (1440 min) in web/pnpm-workspace.yaml, so a
    # proposed direct dependency has already cleared pnpm's cutoff when CI
    # installs it. Transitive versions are resolved by pnpm, not Dependabot —
    # they stay covered only while the lockfile is written by pnpm >= 10.16.
    cooldown:
      default-days: 1
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
