coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 5%

# Report Go and SPA coverage as one project: they ship in the same binary.
flag_management:
  default_rules:
    carryforward: true

ignore:
  # swaggo-generated from annotations by `make swagger`.
  - "internal/api/swagger/**"
  # sqlc-generated by `make assets`; not committed, so CI never sees it.
  - "internal/db/queries/**"
  # Test-only helpers, never shipped in the binary.
  - "internal/testutil/**"
  # Test files themselves.
  - "**/*_test.go"
  - "web/src/**/__tests__/**"
  - "web/src/**/*.test.ts"
  - "web/src/**/*.test.tsx"
  # Regenerated on every build by @tanstack/router-plugin.
  - "web/src/routeTree.gen.ts"
